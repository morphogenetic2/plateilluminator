<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Program Configurator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Sortable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="app-title">
                <i class="fas fa-lightbulb"></i>
                LED Configurator
            </div>
            <div class="header-actions">
                <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)"
                    style="font-size: 1rem; background: var(--bg-input); padding: 8px; border-radius: 8px;">
                    <i class="fas fa-undo"></i> Undo
                </button>
            </div>
        </header>

        <div class="main-grid">
            <!-- Left Panel: LED Selection -->
            <aside class="panel">
                <div class="panel-title">
                    <span>Selection</span>
                    <i class="fas fa-th"></i>
                </div>
                <!-- Batch Edit Warning Banner -->
                <div id="batch-banner" class="batch-banner" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Batch: <strong id="batch-count">0</strong></span>
                </div>

                <div class="led-grid-container">
                    <div class="led-grid" id="led-grid">
                        <!-- LEDs generated by JS -->
                    </div>
                </div>

                <div class="led-actions">
                    <button class="segment-btn" id="select-all-btn">All</button>
                    <button class="segment-btn" id="select-none-btn">None</button>
                    <button class="segment-btn" id="clear-selected-btn">Clear</button>
                </div>
            </aside>

            <!-- Right Panel: Editor -->
            <main class="panel editor-container" style="position: relative;">

                <!-- Column 1: Step Editor -->
                <div class="editor-column">
                    <div class="panel-title">
                        <span>Step Editor</span>
                        <i class="fas fa-sliders-h"></i>
                    </div>

                    <div class="control-group">
                        <span class="label-text">Type</span>
                        <div class="segmented-control" id="step-type-buttons">
                            <button class="segment-btn is-selected step-type-btn" data-value="ON">
                                <i class="fas fa-lightbulb"></i> ON
                            </button>
                            <button class="segment-btn step-type-btn" data-value="OFF">
                                <i class="fas fa-power-off"></i> OFF
                            </button>
                            <button class="segment-btn step-type-btn" data-value="RAMP">
                                <i class="fas fa-chart-line"></i> RAMP
                            </button>
                            <button class="segment-btn step-type-btn" data-value="SINE">
                                <i class="fas fa-wave-square"></i> SINE
                            </button>
                        </div>
                    </div>

                    <div class="control-group">
                        <span class="label-text">Duration</span>
                        <input type="number" id="step-duration" class="compact-input" value="1000" min="50">
                        <span class="input-suffix">ms</span>
                    </div>

                    <!-- Dynamic Param Zones -->
                    <div id="params-on" class="params-zone active step-params">
                        <div class="control-group">
                            <span class="label-text">Intensity</span>
                            <input type="number" id="on-int" class="compact-input" value="1000" min="0" max="1400">
                            <span class="input-suffix">µW/cm²</span>
                        </div>
                    </div>

                    <div id="params-ramp" class="params-zone step-params">
                        <div class="control-group">
                            <span class="label-text">Start</span>
                            <input type="number" id="ramp-int0" class="compact-input" value="0" min="0" max="1400">
                        </div>
                        <div class="control-group">
                            <span class="label-text">End</span>
                            <input type="number" id="ramp-int1" class="compact-input" value="1000" min="0" max="1400">
                            <span class="input-suffix">µW/cm²</span>
                        </div>
                    </div>

                    <div id="params-sine" class="params-zone step-params">
                        <div class="control-group">
                            <span class="label-text">Min</span>
                            <input type="number" id="sine-int0" class="compact-input" value="100" min="0" max="1400">
                        </div>
                        <div class="control-group">
                            <span class="label-text">Max</span>
                            <input type="number" id="sine-int1" class="compact-input" value="800" min="0" max="1400">
                        </div>
                        <div class="control-group">
                            <span class="label-text">Freq</span>
                            <input type="number" id="sine-freq" class="compact-input" value="1" min="0" max="20"
                                step="0.1">
                            <span class="input-suffix">Hz</span>
                        </div>
                    </div>

                    <div style="margin-top: auto; display: flex; gap: 8px;">
                        <button class="btn-primary" id="add-step-btn" style="flex: 1;">
                            <i class="fas fa-plus-circle"></i> Add Step
                        </button>
                        <button class="btn-primary" id="update-step-btn"
                            style="flex: 1; display: none; background: var(--accent-success);">
                            <i class="fas fa-save"></i> Update
                        </button>
                        <button class="segment-btn" id="cancel-step-btn" style="display: none;">
                            Cancel
                        </button>
                    </div>
                </div>

                <!-- Column 2: block Manager -->
                <div class="editor-column" style="border-left: 1px solid var(--border-subtle); padding-left: 2rem;">
                    <div class="panel-title">
                        <span>block Manager <span id="block-led-label" style="color: var(--primary);"></span></span>
                        <i class="fas fa-layer-group"></i>
                    </div>

                    <div class="control-group">
                        <select id="block-selector" style="flex:1;"></select>
                        <button class="btn-icon success" id="add-block-btn" title="New block"><i
                                class="fas fa-plus"></i></button>
                        <button class="btn-icon danger" id="remove-block-btn" title="Delete block"><i
                                class="fas fa-trash"></i></button>
                    </div>

                    <div class="control-group">
                        <span class="label-text">Name</span>
                        <input type="text" id="block-name-input" placeholder="block Name" style="flex:1;">
                    </div>

                    <div class="control-group">
                        <span class="label-text">Repeat</span>
                        <div class="segmented-control" style="flex:1;">
                            <button class="segment-btn repeat-mode-btn" data-mode="continuous"
                                style="flex:1; justify-content: center;">Cont.</button>
                            <button class="segment-btn repeat-mode-btn" data-mode="once"
                                style="flex:1; justify-content: center;">Once</button>
                            <button class="segment-btn repeat-mode-btn" data-mode="count"
                                style="flex:1; justify-content: center;">Count</button>
                            <button class="segment-btn repeat-mode-btn" data-mode="duration"
                                style="flex:1; justify-content: center;">Duration</button>
                        </div>
                    </div>

                    <div class="control-group" id="repeat-count-field" style="display: none;">
                        <span class="label-text">Count</span>
                        <input type="number" id="repeat-count-input" class="compact-input" value="10" min="1">
                        <span class="input-suffix">times</span>
                    </div>

                    <div class="control-group" id="repeat-duration-field" style="display: none;">
                        <span class="label-text">For</span>
                        <input type="number" id="repeat-duration-input" class="compact-input" value="1" min="0"
                            step="0.1">
                        <span class="input-suffix">min</span>
                    </div>
                </div>
            </main>
        </div>

        <!-- Timeline -->
        <div class="panel">
            <div class="panel-title">
                <span>Timeline <span id="timeline-label" style="color: var(--primary);"></span></span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button id="view-all-btn" class="segment-btn" style="font-size: 0.75rem; padding: 4px 8px;">
                        <i class="fas fa-table"></i> View All
                    </button>
                    <i class="fas fa-stream"></i>
                </div>
            </div>
            <div class="timeline-strip" id="timeline-display">
                <span class="timeline-empty">Select LEDs to see timeline</span>
            </div>
        </div>

        <!-- Footer / IO -->
        <div class="panel io-bar">
            <div class="io-controls">
                <div class="io-controls">

                    <!-- Playback Cluster -->
                    <div class="playback-cluster">
                        <button id="sim-stop-btn" class="control-btn small" title="Stop/Reset">
                            <i class="fas fa-stop"></i>
                        </button>
                        <button id="sim-play-btn" class="control-btn primary" title="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>

                        <div class="sim-time-display" id="sim-time-display">00:00:00.000</div>

                        <div class="segmented-control">
                            <button class="segment-btn sim-speed-btn is-selected" data-speed="1">1x</button>
                            <button class="segment-btn sim-speed-btn" data-speed="5">5x</button>
                            <button class="segment-btn sim-speed-btn" data-speed="10">10x</button>
                        </div>
                    </div>

                    <div style="width: 1px; background: var(--border-subtle); height: 24px; margin: 0 8px;"></div>

                    <button class="segment-btn" id="load-btn">
                        <i class="fas fa-folder-open"></i> Load
                    </button>
                    <button class="btn-primary" id="export-btn" style="padding: 0.6rem 1rem; font-size: 0.85rem;">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>

                <div class="duration-display">
                    <label>TOTAL DURATION</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="number" id="run-time-hours" class="compact-input" value="0" min="0"
                            style="width: 50px;">
                        <span class="input-suffix">h</span>
                        <input type="number" id="run-time-minutes" class="compact-input" value="0" min="0" max="59"
                            style="width: 50px;">
                        <span class="input-suffix">m</span>
                        <input type="number" id="run-time-seconds" class="compact-input" value="0" min="0" max="59"
                            style="width: 50px;">
                        <span class="input-suffix">s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- View All Modal -->
        <div id="view-all-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Program</h3>
                    <button id="close-view-all-btn" class="btn-icon" title="Close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="all-timelines-container" class="all-timelines-scrollable">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>



        <script src="script.js"></script>
</body>

</html>
